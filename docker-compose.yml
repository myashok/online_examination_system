services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: oes_root_pass
      MYSQL_DATABASE: oes
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - oes_mysql:/var/lib/mysql
      - ./database/docker-init.sql:/docker-entrypoint-initdb.d/01-users.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-poes_root_pass"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    environment:
      OES_SECRET_KEY: dev-only-online-examination-system-change-me
      OES_DEBUG: "1"
      OES_ALLOWED_HOSTS: localhost,127.0.0.1,backend,web
      OES_DB_HOST: mysql
      OES_DB_PORT: "3306"
      OES_DB_NAME: oes
      OES_MIGRATOR_USER: oes_migrator
      OES_MIGRATOR_PASSWORD: oes_migrator_pass
      OES_APP_USER: oes_app
      OES_APP_PASSWORD: oes_app_pass
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  oes_mysql:
